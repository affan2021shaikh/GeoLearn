# This GitHub Actions workflow was generated by AI-based software and modified by Affan Shaikh (human)

# Save as .github/workflows/update-gitignore.yml
name: Update .gitignore from github/gitignore

on:
  push:
    # GitHub Actions `paths` must be relative to the repository root.
    # Assuming `./../../gitignore/GeoLearn.gitignore` resolves to `.github/gitignore/GeoLearn.gitignore` in your repo.
    paths:
      - ".github/gitignore/GeoLearn.gitignore"
  schedule:
    # Runs at 00:00 UTC on the first day of every month
    # (cron syntax: minute hour day-of-month month day-of-week)
    - cron: "0 0 1 * *"
  workflow_dispatch: # allows manual runs for testing

permissions:
  contents: write # needed to push the updated .gitignore

# Never run two syncs at the same time
concurrency:
  group: update-gitignore
  cancel-in-progress: false

env:
  UPSTREAM_REPO: github/gitignore
  UPSTREAM_DIR: Global

jobs:
  update-gitignore:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check for commits in github/gitignore/Global
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 1. Always get the absolute latest upstream SHA for the download step
          latest_sha=$(gh api --method GET "repos/${UPSTREAM_REPO}/commits" \
            -f path="${UPSTREAM_DIR}" -f per_page=1 \
            --jq '.[0].sha // empty')

          if [ -z "${latest_sha}" ]; then
            echo "::error::Could not find any commits in ${UPSTREAM_REPO}/${UPSTREAM_DIR}/"
            exit 1
          fi
          echo "Latest upstream SHA: ${latest_sha}"
          echo "sha=${latest_sha}" >> "$GITHUB_OUTPUT"

          needs_merge=false

          # 2. Determine if we need to run the merge
          # If triggered by push, it means GeoLearn.gitignore was updated
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "Triggered by push event (GeoLearn.gitignore updated)."
            needs_merge=true
          else
            # Date of the last commit in THIS repository that touched .gitignore.
            since=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/commits" \
              -f sha="${GITHUB_SHA}" \
              -f path=.gitignore \
              -f per_page=1 \
              --jq '.[0].commit.committer.date // empty')

            args=(-f path="${UPSTREAM_DIR}" -f per_page=1)
            if [ -n "${since}" ]; then
              args+=(-f since="${since}")
              echo "Looking for commits in ${UPSTREAM_REPO}/${UPSTREAM_DIR}/ since ${since}"
            else
              echo ".gitignore has no commit history yet - not filtering by date"
            fi

            new_sha=$(gh api --method GET "repos/${UPSTREAM_REPO}/commits" "${args[@]}" \
              --jq '.[0].sha // empty')

            if [ -n "${new_sha}" ]; then
              echo "New upstream commits found."
              needs_merge=true
            else
              echo "::notice::No new commits in ${UPSTREAM_REPO}/${UPSTREAM_DIR}/ - nothing to do."
            fi
          fi

          echo "needs_merge=${needs_merge}" >> "$GITHUB_OUTPUT"

      # When there are no new upstream commits and GeoLearn.gitignore wasn't updated,
      # every step below is skipped.
      - name: Checkout repository
        if: steps.check.outputs.needs_merge == 'true'
        uses: actions/checkout@v7

      - name: Download and merge files from github/gitignore/Global
        if: steps.check.outputs.needs_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.check.outputs.sha }}
        run: |
          set -euo pipefail

          work=$(mktemp -d)
          trap 'rm -rf "${work}"' EXIT

          # Download github/gitignore as of the commit found above (one request,
          # one consistent snapshot) and unpack only the *.gitignore files that sit
          # directly in Global/. README.md and sub-folders are left out.
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o "${work}/upstream.tar.gz" \
            "${GITHUB_API_URL}/repos/${UPSTREAM_REPO}/tarball/${UPSTREAM_SHA}"
          mkdir "${work}/src"
          tar -xzf "${work}/upstream.tar.gz" -C "${work}/src" --strip-components=1 \
            --wildcards --no-wildcards-match-slash "*/${UPSTREAM_DIR}/*.gitignore"
          dir=$(realpath "${work}/src/${UPSTREAM_DIR}")

          # Plain byte (ASCII) order: LC_ALL=C sorts uppercase before lowercase,
          # so VisualStudioCode.gitignore comes before macOS.gitignore.
          find "${dir}" -maxdepth 1 -name '*.gitignore' \( -type f -o -type l \) -printf '%f\n' \
            | LC_ALL=C sort > "${work}/names.txt"
          mapfile -t files < "${work}/names.txt"

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No .gitignore files found in ${UPSTREAM_REPO}/${UPSTREAM_DIR}/"
            exit 1
          fi

          : > "${work}/merged"
          for i in "${!files[@]}"; do
            file="${files[$i]}"

            # Some templates are symlinks (Octave.gitignore -> MATLAB.gitignore).
            # Follow them, but never out of Global/.
            target=$(realpath -e -- "${dir}/${file}")
            case "${target}" in
              "${dir}"/*) ;;
              *) echo "::error::${file} points outside ${UPSTREAM_DIR}/"; exit 1 ;;
            esac

            # One blank line between sections, none after the last one
            if [ "${i}" -gt 0 ]; then
              printf '\n' >> "${work}/merged"
            fi
            printf '# %s\n' "${file%.gitignore}" >> "${work}/merged"
            cat "${target}" >> "${work}/merged"

            # Make sure every section ends with a newline
            if [ -n "$(tail -c 1 "${target}")" ]; then
              printf '\n' >> "${work}/merged"
            fi
          done

          # Append custom gitignore after all upstream appends
          custom_file="./../../gitignore/GeoLearn.gitignore"
          if [ -f "${custom_file}" ]; then
            printf '\n' >> "${work}/merged"
            cat "${custom_file}" >> "${work}/merged"

            # Make sure the custom section also ends with a newline
            if [ -n "$(tail -c 1 "${custom_file}")" ]; then
              printf '\n' >> "${work}/merged"
            fi
          else
            echo "::warning::${custom_file} not found, skipping custom append."
          fi

          cp "${work}/merged" .gitignore
          echo "Merged ${#files[@]} files into .gitignore"

      - name: Commit and push the updated .gitignore
        if: steps.check.outputs.needs_merge == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.check.outputs.sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .gitignore

          # Only commit if the merged file actually differs from the current one
          if git diff --cached --quiet -- .gitignore; then
            echo "::notice::The merged .gitignore is identical to the existing one - nothing to commit."
            exit 0
          fi

          # Conventional Commits: <type>(<scope>): <description>, then an optional body
          git commit \
            -m "chore(gitignore): update .gitignore from github/gitignore" \
            -m "Regenerated from ${UPSTREAM_REPO}/${UPSTREAM_DIR} at ${UPSTREAM_REPO}@${UPSTREAM_SHA}."
          git push
